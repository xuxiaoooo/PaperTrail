<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>PaperTrail · Overview</title><link rel="stylesheet" href="/tray.css"><script src="/tray.js" defer></script></head>
<body><header><div><img class="brand-mark" src="/mark.svg" alt=""><strong>PaperTrail</strong><span id="count">投稿进度</span></div><button id="refresh" aria-label="刷新投稿状态" title="刷新投稿状态"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.7-1L20 9M4 15l2.2 3A7 7 0 0 0 18 17"/></svg></button></header>
<main id="papers" aria-label="稿件状态列表"><p class="empty">正在读取本地状态…</p></main><div class="summary"><span id="updated">尚未刷新</span><p id="message" role="status"></p></div>
<footer><button id="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9h16"/></svg>打开主页面</button><button id="quit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8M7 5.5a8 8 0 1 0 10 0"/></svg>退出</button></footer></body></html>
